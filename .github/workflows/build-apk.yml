name: Build Android Debug APK

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Restore signing keystore
        env:
          ECJTU_KEYSTORE_BASE64: ${{ secrets.ECJTU_KEYSTORE_BASE64 }}
        run: |
          test -n "$ECJTU_KEYSTORE_BASE64"
          printf '%s' "$ECJTU_KEYSTORE_BASE64" | base64 --decode > 114514.jks
          test -s 114514.jks

      - name: Build Debug APK
        env:
          ECJTU_KEYSTORE_PASSWORD: ${{ secrets.ECJTU_KEYSTORE_PASSWORD }}
          ECJTU_KEY_PASSWORD: ${{ secrets.ECJTU_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Remove restored signing keystore
        if: always()
        run: rm -f 114514.jks

      - name: Verify Debug APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECJTUEE-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ECJTU ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
