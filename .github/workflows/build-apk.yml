name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate launcher icon from repository 1.ico
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          convert '1.ico[0]' -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert '1.ico[0]' -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert '1.ico[0]' -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert '1.ico[0]' -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert '1.ico[0]' -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Restore signing keystore
        env:
          ECJTU_KEYSTORE_BASE64: ${{ secrets.ECJTU_KEYSTORE_BASE64 }}
        run: |
          test -n "$ECJTU_KEYSTORE_BASE64"
          printf '%s' "$ECJTU_KEYSTORE_BASE64" | base64 --decode > 114514.jks
          test -s 114514.jks

      - name: Build debug APK
        env:
          ECJTU_KEYSTORE_PASSWORD: ${{ secrets.ECJTU_KEYSTORE_PASSWORD }}
          ECJTU_KEY_PASSWORD: ${{ secrets.ECJTU_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Remove restored signing keystore
        if: always()
        run: rm -f 114514.jks

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ECJTU-Latest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
